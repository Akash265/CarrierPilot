services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: career_intel
      POSTGRES_PASSWORD: career_intel
      POSTGRES_DB: career_intel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career_intel"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # minio/minio was removed from Docker Hub and quay.io/minio/minio now rejects
    # anonymous pulls (401). Chainguard's MinIO build is anonymously pullable; its
    # free tier only publishes `latest`, so it is pinned by digest (DECISIONS.md D88).
    image: cgr.dev/chainguard/minio@sha256:71674988a1c7ddd5724928633199152b11e4ddefd6c6ce2d60772ff4a8f22ca9
    # The image runs as uid 65532 by default; existing minio_data volumes were
    # written as root by the previous image, so run as root to keep them usable.
    user: "0:0"
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      # The image has no curl; its bundled `mc` checks the same liveness endpoint.
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Opt-in: `docker compose --profile workers up -d` (plain `up -d` still starts only the infra above).
  # Daily retention sweep (DECISIONS.md D119, D125). Config comes from the repo's .env; only the
  # hostnames are overridden to reach the services above on the compose network.
  maintenance-worker:
    profiles: ["workers"]
    build:
      context: ..
      dockerfile: services/maintenance-worker/Dockerfile
    image: careerpilot-maintenance-worker
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://career_intel_app:career_intel_app@postgres:5432/career_intel
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
